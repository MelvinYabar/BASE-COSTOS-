services:
  - type: web
    name: avanti-historico-precios
    runtime: static
    buildCommand: echo "Static assets are ready"
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
